trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.12"

  - script: |
      python -m pip install uv
      uv sync --locked
    displayName: Install dependencies

  - script: uv run ruff check .
    displayName: Ruff check

  - script: uv run ruff format --check .
    displayName: Ruff format check

  - script: uv run pytest -m "not integration"
    displayName: Unit tests

  - script: |
      if [ -f infra/main.bicep ]; then
        az bicep build --file infra/main.bicep
      else
        echo "infra/main.bicep not found, skipped"
      fi
    displayName: Bicep build
