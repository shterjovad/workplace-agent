[project]
name = "workplace-agent"
version = "0.1.0"
description = "Document ingestion pipeline and grounded Q&A CLI on Azure"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-ai-documentintelligence>=1.0.2",
    "azure-identity>=1.27.0",
    "azure-keyvault-secrets>=4.12.0",
    "azure-monitor-opentelemetry>=1.8.12",
    "azure-search-documents>=12.1.0",
    "azure-storage-blob>=12.31.1",
    "openai>=3.51.0",
    "pydantic-settings>=2.16.3",
    "tiktoken>=0.14.0",
    "typer>=0.29.1",
]

[project.scripts]
workplace-agent = "workplace_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workplace_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".claude", ".awos", "context"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = [
    "integration: live Azure tests, skipped unless env vars are set",
    "regression: acceptance tests kept for long-term regression of the feature",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pypdf>=7.1.0",
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.5",
]
